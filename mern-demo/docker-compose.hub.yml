services:
  backend:
    image: vohoangkhang234923/mern-backend:1.0
    ports:
      - "5000:5000"
    dns:
      - 8.8.8.8
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
    networks:
      - mern-network

  frontend:
    image: vohoangkhang234923/mern-frontend:2.0
    ports:
      - "3000:80"
    dns:
      - 8.8.8.8
    depends_on:
      - backend
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge